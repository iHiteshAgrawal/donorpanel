[project]
name = "donorpanel"
version = "0.1.0"
description = "Multi-agent donor coordination for transfusion-dependent patients"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.55.0",
    "strands-agents-tools>=0.8.8",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "bedrock-agentcore>=1.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "moto[dynamodb]>=5.0"]

[project.scripts]
donorpanel = "donorpanel.entrypoints.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/donorpanel"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI requires these in argument defaults; that is the framework idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
