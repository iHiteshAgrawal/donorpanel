<!doctype html>
<meta charset="utf-8">
<title>DonorPanel post figures</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;1,6..72,300&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f2eb; --card:#fbf9f4; --ink:#1a1715; --soft:#655f58;
  --green:#34c759; --deep:#176f35; --mint:#dff4df; --line:rgba(46,40,34,.16);
  --aws:#e8effb; --awsink:#1f4f8f; --red:#b8372c; --rose:#f7ece9;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ui:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --serif:"Newsreader",Iowan Old Style,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e7e2d8;font-family:var(--ui);padding:40px;display:flex;flex-direction:column;gap:40px;align-items:flex-start}
figure{background:var(--paper);color:var(--ink);width:1600px;padding:64px 72px;border-radius:2px}
figure.cover{width:1600px;height:840px;padding:88px 96px;display:flex;flex-direction:column;justify-content:space-between}

.eyebrow{font:700 20px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--deep)}
.ftitle{font:800 52px/1.1 var(--display);letter-spacing:-.028em;margin-top:18px}
.fsub{font:400 26px/1.45 var(--ui);color:var(--soft);margin-top:16px;max-width:1200px}
.rule{height:1px;background:var(--line);margin:36px 0}

/* cover */
.cover h1{font:800 88px/1.06 var(--display);letter-spacing:-.035em;max-width:1080px}
.cover .lede{font:300 38px/1.4 var(--serif);color:var(--soft);margin-top:24px;max-width:1000px}
.cover .foot{display:flex;justify-content:space-between;align-items:flex-end;font:600 24px var(--ui);color:var(--soft)}
.strip{display:flex;align-items:center;gap:0;margin:44px 0 8px}
.snode{flex:0 0 auto;padding:14px 15px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font:700 21px var(--ui);text-align:center;white-space:nowrap}
.snode small{display:block;font:700 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:5px}
.snode.agent{background:var(--mint);border-color:var(--deep)}
.snode.agent small{color:var(--deep)}
.sedge{flex:1 1 auto;height:2px;background:var(--line);min-width:10px}

/* generic table rendered as rows */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;align-items:start;margin-top:10px}
.cols .grp:first-child{margin-top:20px}
.grp{margin-top:30px}
.grp h3{font:700 15px var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--deep);margin-bottom:14px}
.rows{display:flex;flex-direction:column;gap:9px}
.r{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:baseline;padding:13px 20px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.r .k{font-family:var(--mono);font-size:17px;font-weight:500;color:var(--ink);line-height:1.35}
.r .v{font:400 18px/1.38 var(--ui);color:var(--soft)}
.r.aws .k{font-family:var(--ui);font-weight:700;font-size:19px}
.r.aws{background:var(--aws);border-color:rgba(31,79,143,.24)}

/* two column compare */
.two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px}
.pane{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:32px 34px}
.pane.bad{background:var(--rose);border-color:rgba(184,55,44,.3)}
.pane.good{background:var(--mint);border-color:var(--deep)}
.pane .h{font:700 15px var(--ui);letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
.pane.bad .h{color:var(--red)} .pane.good .h{color:var(--deep)}
.pane .big{font:800 66px/1 var(--display);letter-spacing:-.03em;margin:16px 0 6px}
.pane.bad .big{color:var(--red)} .pane.good .big{color:var(--deep)}
.pane ul{list-style:none;margin-top:18px;display:flex;flex-direction:column;gap:11px}
.pane li{font:500 21px/1.4 var(--ui);padding-left:20px;position:relative}
.pane li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}

/* flow of boxes */
.flow{display:flex;align-items:stretch;gap:0;margin-top:34px}
.step{flex:1 1 0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:26px 26px}
.step .n{font:700 14px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--deep)}
.step .t{font:800 34px/1.1 var(--display);margin-top:10px;letter-spacing:-.02em}
.step .d{font:400 19px/1.42 var(--ui);color:var(--soft);margin-top:12px}
.step.stop{background:var(--ink);border-color:var(--ink)}
.step.stop .t,.step.stop .d{color:var(--card)} .step.stop .n{color:var(--green)}
.arrow{flex:0 0 44px;display:grid;place-items:center;font:400 30px var(--ui);color:var(--soft)}

/* stacked causes */
.cause{display:grid;grid-template-columns:64px 1fr 1fr;gap:28px;align-items:start;padding:22px 26px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.cause .num{width:46px;height:46px;border-radius:50%;background:var(--rose);color:var(--red);display:grid;place-items:center;font:800 22px var(--ui)}
.cause .why{font:600 22px/1.4 var(--ui)}
.cause .fix{font:400 20px/1.4 var(--ui);color:var(--deep)}
.cause .fix b{font-weight:700}
.colhead{display:grid;grid-template-columns:64px 1fr 1fr;gap:28px;padding:0 26px 10px;font:700 14px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}

/* memory paths */
.path{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px}
.mcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:32px 34px}
.mcard .api{font-family:var(--mono);font-size:23px;font-weight:600;color:var(--deep)}
.mcard .when{font:700 15px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
.mcard .d{font:400 21px/1.45 var(--ui);color:var(--soft);margin-top:14px}
.mcard .eg{font:500 19px/1.4 var(--ui);color:var(--ink);margin-top:16px;padding-left:18px;border-left:3px solid var(--green)}
.note{font:400 21px/1.45 var(--ui);color:var(--soft);margin-top:28px;max-width:1300px}
.note b{color:var(--ink);font-weight:700}
.branch{font:400 21px var(--ui);color:var(--soft);margin-top:26px}
.branch b{color:var(--ink);font-weight:700}
</style>

<!-- ============ COVER ============ -->
<figure class="cover" data-fig="cover">
  <div>
    <div class="eyebrow">Agents for Humans</div>
    <h1>Only two of these ten nodes are agents.</h1>
    <div class="lede">Building a blood donor coordinator on Strands Agents and Amazon Bedrock
      AgentCore, where everything that decides routing is deterministic code.</div>
  </div>
  <div class="strip">
    <div class="snode">intake<small>code</small></div><div class="sedge"></div>
    <div class="snode agent">verify<small>agent</small></div><div class="sedge"></div>
    <div class="snode">adjudicate<small>code</small></div><div class="sedge"></div>
    <div class="snode">accept<small>code</small></div><div class="sedge"></div>
    <div class="snode">eligibility<small>code</small></div><div class="sedge"></div>
    <div class="snode">rank<small>code</small></div><div class="sedge"></div>
    <div class="snode agent">compose<small>agent</small></div><div class="sedge"></div>
    <div class="snode">gate<small>code</small></div><div class="sedge"></div>
    <div class="snode">dispatch<small>code</small></div>
  </div>
  <div class="foot">
    <div>DonorPanel</div>
    <div>Asha finds blood donors, so families don't have to</div>
  </div>
</figure>


<!-- ============ GRAPH STRIP ============ -->
<figure data-fig="graph-strip" style="padding:56px 64px">
  <div class="eyebrow">The request graph</div>
  <div class="ftitle" style="font-size:44px">Two agents. Eight deterministic nodes.</div>
  <div class="strip" style="margin:40px 0 0">
    <div class="snode">intake<small>code</small></div><div class="sedge"></div>
    <div class="snode agent">verify<small>agent</small></div><div class="sedge"></div>
    <div class="snode">adjudicate<small>code</small></div><div class="sedge"></div>
    <div class="snode">accept<small>code</small></div><div class="sedge"></div>
    <div class="snode">eligibility<small>code</small></div><div class="sedge"></div>
    <div class="snode">rank<small>code</small></div><div class="sedge"></div>
    <div class="snode agent">compose<small>agent</small></div><div class="sedge"></div>
    <div class="snode">gate<small>code</small></div><div class="sedge"></div>
    <div class="snode">dispatch<small>code</small></div>
  </div>
  <div class="branch">adjudicate also branches to <b>close</b> when the request is rejected.</div>
</figure>
